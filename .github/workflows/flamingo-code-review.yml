# Generated by the Flamingo hub — do not edit by hand.
# Per-repo settings live in the hub admin (/admin/code-review); this file is
# byte-identical across every reviewed repository, which is what makes drift
# detectable by comparison.
name: Flamingo Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  repository_dispatch:
    types: [flamingo-code-review]

# Superseding a PR cancels the in-flight REVIEW only. The gate job is outside
# this group on purpose: a cancelled required check is a merge deadlock.
concurrency:
  group: flamingo-code-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    # Drafts, bots and forks never dispatch. A fork's token is read-only
    # regardless of what is declared here, so running would only waste minutes.
    # NOTE: there is deliberately no vars. kill switch here. The hub's
    # per-repo enabled dial already covers it and answers 409 REVIEW_DISABLED,
    # which produces a recorded run. A second switch living in GitHub would be
    # invisible to the admin screen and would produce no callback at all.
    if: >-
      (github.event_name == 'repository_dispatch' ||
       (github.event.pull_request.draft == false &&
        github.event.pull_request.user.type != 'Bot' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The review job must never hold a push credential.
          persist-credentials: false

      # The corpus hash has to SURVIVE between runs, or the hash param is empty
      # and the 304 path the hub implements is unreachable — the corpus would be
      # transferred in full on every run in both modes.
      - name: Restore the last corpus hash
        uses: actions/cache@v4
        with:
          # BOTH files. Caching only the hash meant a 304 left rules.json
          # truncated to zero bytes while the run continued as if it had a
          # corpus.
          path: |
            .rules-hash
            rules.json
          key: flamingo-rules-hash-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            flamingo-rules-hash-${{ github.repository }}-

      - name: Fetch the rule corpus
        id: rules
        env:
          HUB_URL: "http://localhost:3000"
          REPO_NAME: "NATS Rust Client"
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # Hash-addressed: the stored corpus hash is sent back, so an unchanged
          # corpus answers 304 and a green run costs one conditional request.
          # The secret goes in a HEADER, never the query string — a URL with a
          # secret in it lands in access logs and proxy history.
          prev=$(cat .rules-hash 2>/dev/null || echo '')
          code=$(curl -sS -o rules.json -w '%{http_code}' \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            "$HUB_URL/api/code-review/rules?repo=$(printf %s "$REPO_NAME" | jq -sRr @uri)&format=prompt&hash=$prev")
          if [ "$code" = "304" ]; then
            if [ ! -s rules.json ]; then
              echo "::warning::304 with no cached corpus — re-fetching in full."
              curl -sS -o rules.json \
                -H "Authorization: Bearer $WEBHOOK_SECRET" \
                "$HUB_URL/api/code-review/rules?repo=$(printf %s "$REPO_NAME" | jq -sRr @uri)&format=prompt"
            else
              echo "Corpus unchanged since the last run."
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "409" ]; then
            echo "Review is disabled for this repository — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "degraded=review_disabled" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            # Fail OPEN but LOUD, and record it: a silent skip on a blocking repo
            # is indistinguishable from a clean review.
            echo "::warning::Could not fetch the rule corpus (HTTP $code) — review skipped, reported as degraded."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "degraded=corpus_unavailable_http_$code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          jq -r '.hash' rules.json > .rules-hash

      - name: Review
        if: steps.rules.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event_name == 'repository_dispatch' && 'sweep' || 'pr' }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          # The reviewer itself is delivered by the hub as a hash-pinned script
          # (see /api/code-review/scripts). Until that lands this step reports a
          # no-op run rather than pretending to have reviewed anything.
          echo "::notice::Rule corpus resolved ($(cat .rules-hash)). Reviewer not yet installed."
          echo '{"findings":[]}' > findings.json

      - name: Report back to the hub
        if: always()
        env:
          HUB_URL: "http://localhost:3000"
          WEBHOOK_SECRET: ${{ secrets.DOC_ORCH_WEBHOOK_SECRET }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          # Minted per run by the hub and shipped in the dispatch. It binds this
          # callback to THIS run: the org-wide secret alone would let any repo's
          # workflow report against another repo's run.
          RUN_TOKEN: ${{ github.event.client_payload.run_token }}
        run: |
          set -euo pipefail
          # A sweep carries its run id from the dispatch. A PR run has none, so
          # the hub creates the row from this callback.
          jq -n \
            --arg run_id "${RUN_ID:-}" \
            --arg status "$([ -n '${{ steps.rules.outputs.degraded }}' ] && echo neutral || echo '${{ job.status }}')" \
            --arg head_sha "${{ github.event.pull_request.head.sha }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg ruleset_hash "$(cat .rules-hash 2>/dev/null || echo '')" \
            --arg degraded "${{ steps.rules.outputs.degraded }}" \
            --arg repo_full "${{ github.repository }}" \
            --arg pr_number "${{ github.event.pull_request.number }}" \
            --arg mode "${{ github.event_name == 'repository_dispatch' && 'sweep' || 'pr' }}" \
            --argjson findings "$(jq -c '.findings // []' findings.json 2>/dev/null || echo '[]')" \
            '{run_id: $run_id, status: $status, head_sha: $head_sha, mode: $mode,
              repo_full_name: $repo_full,
              pr_number: (if $pr_number == "" then null else ($pr_number|tonumber) end),
              degraded_reason: (if $degraded == "" then null else $degraded end),
              workflow_run_id: $workflow_run_id,
              ruleset_hash: (if $ruleset_hash == "" then null else $ruleset_hash end),
              findings: $findings}' > payload.json
          # --fail-with-body ON PURPOSE: a rejected callback must turn the
          # check red. Without it the job stayed green while the hub recorded
          # nothing, which is how PR mode silently produced no data at all.
          curl -sS --fail-with-body -X POST "$HUB_URL/api/code-review/webhook" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "X-Run-Token: ${RUN_TOKEN:-}" \
            -H 'Content-Type: application/json' \
            --data @payload.json
