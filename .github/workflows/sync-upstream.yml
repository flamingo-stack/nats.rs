name: Sync from upstream nats.rs

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: sync/upstream-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "::notice::open sync PR exists for $BRANCH — skipping"
            exit 0
          fi

          git config user.name  "flamingo-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/nats-io/nats.rs.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "::notice::main already contains upstream/main"
            exit 0
          fi

          git checkout -B "$BRANCH" origin/main
          if ! git merge --no-ff --no-edit upstream/main; then
            echo "::notice::merge has conflicts — skipping, will retry next run"
            exit 0
          fi

          echo "::group::Verify fork-only auth_url_callback feature survived the merge"
          if ! grep -R --include="*.rs" -l "auth_url_callback" . > /dev/null; then
            echo "::error::auth_url_callback fork feature is missing after merging upstream/main — aborting sync, not opening a PR"
            git checkout origin/main
            git branch -D "$BRANCH"
            exit 1
          fi
          echo "::endgroup::"

      - name: Build and test fork feature gate
        run: |
          if ! grep -R --include="*.rs" -l "auth_url_callback" . > /dev/null; then
            echo "::notice::auth_url_callback not found — skipping build gate (handled above)"
            exit 0
          fi
          cargo check --workspace --all-features
          cargo test --workspace --all-features -- auth_url_callback

      - name: Push branch and open PR
        run: |
          git push -f origin "$BRANCH"

          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Sync from Fork" \
            --body "Automatic weekly sync from \`nats-io/nats.rs@main\`. Verified that the fork-only \`auth_url_callback\` feature is present and builds/tests successfully after the merge."

